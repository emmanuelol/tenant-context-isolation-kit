[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-context-isolation-kit"
dynamic = ["version"]
description = "SRE-hardened multi-tenant execution context, strict dependency injection, and resilient client pooling."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "gspread>=6.0.0",
    "tenacity>=8.2.0",
    "requests>=2.31.0",
    "urllib3>=1.26.0",
    "typing-extensions>=4.5.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
]
structlog = [
    "structlog>=23.0.0",
]
all = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "sqlalchemy>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "structlog>=23.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.20.0",
]

[tool.hatch.version]
path = "src/tenant_context_isolation_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_context_isolation_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
