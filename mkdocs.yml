site_name: Tenant Context Isolation Kit
site_description: SRE-hardened multi-tenant execution context, strict dependency injection, and resilient client pooling.
site_url: https://github.com/public-staging/tenant-context-isolation-kit
repo_url: https://github.com/public-staging/tenant-context-isolation-kit
repo_name: tenant-context-isolation-kit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

nav:
  - Overview: index.md
  - API Reference: api.md
  - Architecture Decision Records:
      - "ADR 001: ContextVars vs ThreadLocal": adr/001-contextvars-vs-threadlocal.md
      - "ADR 002: Fail-Closed Routing": adr/002-fail-closed-routing-strategy.md
      - "ADR 003: PostgreSQL RLS Scoping": adr/003-postgresql-rls-connection-scoping.md
