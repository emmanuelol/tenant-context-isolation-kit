services:
  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  test:
    build: .
    image: tenant-context-isolation-kit:latest
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests:ro
      - ./src/tenant_context_isolation_kit:/usr/local/lib/python3.11/site-packages/tenant_context_isolation_kit:ro
